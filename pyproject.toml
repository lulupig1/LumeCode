[project]
name = "lumecode"
version = "0.2.0"
description = "A terminal AI coding assistant"
requires-python = ">=3.11"
dependencies = [
    "textual>=2.1.0",
    "anthropic>=0.42.0",
    "openai>=1.60.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "mcp>=1.12.0",
    "httpx>=0.27.0",
    "websockets>=14.0",
]

[project.scripts]
lumecode = "lumecode.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["lumecode"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-timeout>=2.3",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-PyYAML>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
# tests/test_consolidation.py 用 @pytest.mark.timeout(N) 保护长时间 LLM 流程；
# pytest-timeout 插件会注册该标记（不设全局默认，避免拖慢 CI 时误杀）。

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes（未定义名、未使用导入等）
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PIE",  # flake8-pie
    "PERF", # perflint
    "RUF",  # ruff 专有规则
    "BLE",  # 盲式 except（对应"静默吞异常"清理）
    "TRY",  # 异常处理反模式
    "RET",  # return 一致性
    "ASYNC",# async 反模式（如 async 函数里的阻塞调用）
    "ISC",  # 隐式字符串拼接
]
ignore = [
    "E501",    # 行长交给 formatter
    "SIM108",  # 不强制三元表达式
    "TRY003",  # 不强制为异常单独定义消息类
    "TRY300",  # 不强制 try 块内 return
    "BLE001",  # 允许捕获 Exception —— 但必须在日志中记录（见下方 per-file-ignores 注释）
    # 注释/docstring 中的中文全角标点（，。：（））是有意为之，不是笔误。
    "RUF001",
    "RUF002",
    "RUF003",
    # --- 以下为经评估后**刻意**不启用，理由见注释 ---
    # 被标记的都是 exists()/resolve()/stat() 这类元数据调用（微秒级），
    # 包一层 to_thread 的调度开销比调用本身还大；真正的大块 IO 已收敛到
    # tools/file_io.py 与 fileutil.py。进程/阻塞调用已单独处理（见
    # worktree 的 _run_git_async、tools/bash.py 的 spawn_kwargs）。
    "ASYNC240",
    # 列表推导式 vs 显式 for-append 是风格取舍，且本项目的循环多带
    # 条件与副作用，机械转换收益有限。
    "PERF401",
    # `class X(str, Enum)` → `StrEnum` 会改变 str()/f-string 的格式化结果，
    # 属于行为变更，需要先审计所有格式化点再迁移。
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# 测试里可以断言宽泛异常，也允许用同步 subprocess 做 git 夹具搭建。
"tests/**" = ["SIM117", "BLE001", "TRY002", "ASYNC221", "ASYNC230"]

[tool.ruff.lint.isort]
known-first-party = ["lumecode"]

# ---------------------------------------------------------------------------
# mypy
#
# 目标：在 CI 上守住一个稳定的类型基线。这里刻意**不**开 --strict：
# 项目大量使用动态属性（Textual 组件、按需挂载的委托工具），全 strict
# 会淹没信号。当前基线为 0 错误，改动后 CI 直接失败即可。
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["lumecode"]
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true
exclude = ["^\\.venv/", "^build/", "^dist/"]

